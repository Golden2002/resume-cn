# 复旦红模板：模板清单
# 渲染器只读这个文件，不读代码里的常量。换模板即换此文件加对应的布局实现。
#
# 本文件的数值逐项移植自定稿生成脚本 build_resumes.js，不是从 PDF 反推的。
# 那份脚本产出的简历（复旦二附校版）是这套版式的基准。
id: fudan-red
name: 复旦红
version: 1.1.0
description: A4 体例，红色标题条，右上证件照，页脚页码。中文简历常用版式。

font:
  # 字体名写入 DOCX；PDF 转换时由系统字体目录解析，产物门禁会校验是否真的用上。
  # 本仓库不分发任何字体文件：默认字体是本机常备的微软雅黑，别人机器上没有时，
  # 用 --font 换成自己装的字体（如 fonts install 下的思源黑体）即可。
  family: "微软雅黑"
  eastAsia: "微软雅黑"
  fallback:
    - "Source Han Sans SC"
    - "Noto Sans CJK SC"
    - "SimHei"

colors:
  primary: "9D2235"
  ink: "1A1A1A"
  muted: "5A5A5A"
  rule: "D9C3C7"

page:
  size: A4
  # 820 / 1080 twips，与定稿脚本一致。上下留 41 pt，比常见的 32 pt 宽，
  # 首屏不顶到纸边，整页看上去更稳。
  margins:
    topPt: 41
    bottomPt: 41
    leftPt: 54
    rightPt: 54

geometry:
  contentWidthTwip: 9746
  tabStopTwip: 9746
  photo:
    # DOCX 的图片尺寸以像素计（96 dpi），96×128 px 约合 25×34 mm，两寸证件照
    widthPx: 96
    heightPx: 128
    cellWidthTwip: 1500

dateSeparator: " – "

# 教育背景里「专业」与「学位」之间的连接符。定稿写的是空格，不是间隔号。
studyTypeSeparator: " "

# ============ 字号 ============
# 只分三层，不再增加。层级越多，读者越难判断先看哪里。
#   焦点：姓名 20 pt
#   引导：求职意向 11 pt、分区标题 11 pt
#   信息：条目主行 10 pt、正文 10 pt
#   辅助：日期、单位 9.5 pt；页脚 8 pt
# 单位是 pt，渲染时换算为 DOCX 的半磅值。
typography:
  name: 20
  label: 11
  body: 10
  small: 9.5
  sectionTitle: 11
  footer: 8

# ============ 行距 ============
# lineMode 决定 line 字段怎么解释：
#   auto  — 按 OOXML 的倍数走（240 等于单倍），与定稿脚本一致，版式最接近基准。
#   exact — 用下面的 lineHeightPt 当固定行高，页数不随字体度量漂移，但视觉会比基准紧。
# 默认 auto：先对齐既有定稿，稳定性交给 variant 的 pageBudget 兜。
lineMode: auto

lineHeightPt:
  name: 26
  label: 17
  body: 16.5
  small: 15
  section: 20

# ============ 间距 ============
# 条目之间留多少，决定一页能放几条。数值全部沿用定稿脚本。
spacing:
  rule:                 # 姓名下的细线
    before: 40
    after: 160
  section:
    before: 220
    after: 96
    # 分区标题条做成单元格，不用段落底色。段落底色只能随行高变化，
    # 多出来的行距全跑到字上方，白字会偏下，做不到垂直居中；
    # 单元格的 verticalAlign 能把字真正居中，左右留白也能用单元格边距精确给。
    cellMarginTopBottom: 60
    # 左内边距 27 twips，约 1.35 pt。基准的首字距条边 1.44 pt，差的是字形自身的侧距。
    cellMarginLeft: 27
    indentLeft: 0
    indentRight: 0
  entry:
    before: 130
    after: 40
    line: 264
  bullet:
    before: 20
    after: 20
    line: 262
  para:
    before: 40
    after: 40
    line: 268
  header:
    nameAfter: 40
    nameLine: 240
    labelAfter: 60
    labelLine: 250
    metaAfter: 30
    metaLine: 246

# ============ 加粗 ============
# 只有两档字重：常规 400、加粗 700。加粗只给三类内容：
# 姓名、分区标题、条目主标题（机构名、职位名、项目名）。
# 灰色单位串里需要点出关键机构时，用行内 **双星号**，加粗同时改用正文色。
# 日期、联系方式、正文要点一律不加粗；一条经历不超过两处加粗。

footer:
  leftTemplate: "{name}"
  rightTemplate: "应聘：{label}　｜　第 {page} 页 / 共 {pages} 页"

sectionTitles:
  education: 教育背景
  work: 教学与实践经历
  research: 科研与学术经历
  projects: 项目与实践经历
  awards: 荣誉与资质
  certificates: 证书与资质
  publications: 论文与作品
  skills: 语言与技能
  languages: 语言能力

# 单行罗列型分区的标签词
inlineLabels:
  awards: 荣誉
  certificates: 证书
  publications: 作品
  skills: ""
  languages: ""

# 页数预算默认值。variant 可覆盖。
pageBudget: 3

# 声明启用后必须由产物门禁校验的项
gates:
  requireFontsEmbedded: true
  requireDeclaredFont: true
  requireAtsRoundTrip: true
  forbidFullIdNumber: true
  requireStatementLast: true
