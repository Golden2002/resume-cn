# 复旦红模板：模板清单
# 渲染器只读这个文件，不读代码里的常量。换模板即换此文件加对应的布局实现。
id: fudan-red
name: 复旦红
version: 1.0.0
description: A4 两页体例，红色标题条，右上证件照，页脚页码。中文简历常用版式。

font:
  # 字体名写入 DOCX；PDF 转换时由系统字体目录解析，产物门禁会校验是否真的用上。
  # 本仓库不分发任何字体文件：默认字体是本机常备的微软雅黑，别人机器上没有时，
  # 用 --font 换成自己装的字体（如 fonts install 下的思源黑体）即可，版式不会变，
  # 因为行高已在 lineHeightPt 里钉成显式值，不随字体度量浮动。
  family: "微软雅黑"
  eastAsia: "微软雅黑"
  fallback:
    - "Source Han Sans SC"
    - "Noto Sans CJK SC"
    - "SimHei"

colors:
  primary: "9D2235"
  ink: "1A1A1A"
  muted: "5A5A5A"
  rule: "D9C3C7"

page:
  size: A4
  margins:
    topPt: 32
    bottomPt: 32
    leftPt: 54
    rightPt: 54

geometry:
  contentWidthTwip: 9746
  tabStopTwip: 9746
  photo:
    # DOCX 的图片尺寸以像素计（96 dpi），96×128 px 约合 25×34 mm，两寸证件照
    widthPx: 96
    heightPx: 128
    cellWidthTwip: 1500

dateSeparator: " – "

# ============ 排版规范 ============
# 这组数值是定稿，改动前请先读下面三条理由。
#
# 一、字号只分三层
#   名字 19 pt（唯一的大字，页首焦点）
#   分区标题 11 pt、求职意向 11 pt（引导层）
#   条目主行 10 pt、正文 10 pt（信息层）
#   日期与单位 9 pt（辅助层）；页脚 8 pt
#   不再增加层级。层级越多，读者越难判断先看哪里。
#
# 二、行距按中文字面高度定
#   中文正文的舒适区是字号的 1.5 到 1.8 倍。10 pt 正文取 16.5 pt，即 1.65 倍。
#   低于 1.5 会挤，高于 1.8 会散，一页装不下几条内容。
#   分区标题条取 20 pt，让 11 pt 的白字上下各留约 4.5 pt，底色才能包住文字。
#   行距必须是显式值：auto 会跟着字体度量走，换字体后页数就变。
#
# 三、加粗只有两档字重，且只给三类内容
#   400 常规、700 加粗。不引入中间字重。
#   加粗对象只有三类：姓名、分区标题、条目主标题（机构名、职位名、项目名）。
#   在灰色的单位名里点出关键机构时，用行内 **双星号** 标出，加粗同时改用正文色。
#   日期、联系方式、正文要点一律不加粗。一条经历里加粗不超过两处，否则满页黑块，
#   等于没有强调。
typography:
  # 单位为 pt，渲染时换算为 DOCX 的半磅值
  name: 19
  label: 11
  body: 10
  small: 9
  sectionTitle: 11
  footer: 8

# 固定行高（pt），与上面第二条对应
lineHeightPt:
  name: 26
  label: 17
  body: 16.5
  small: 15
  section: 20

spacing:
  section:
    before: 128
    after: 54
    line: 244
  entry:
    before: 74
    after: 20
    line: 246
  bullet:
    before: 10
    after: 10
    line: 240

footer:
  leftTemplate: "{name}"
  rightTemplate: "应聘：{label}　｜　第 {page} 页 / 共 {pages} 页"

# 单行罗列型分区的标签词
inlineLabels:
  awards: 荣誉
  certificates: 证书
  publications: 作品
  skills: ""
  languages: ""

sectionTitles:
  education: 教育背景
  work: 教学与实践经历
  projects: 项目与实践经历
  awards: 荣誉与资质
  certificates: 证书与资质
  publications: 论文与作品
  skills: 语言与技能
  languages: 语言能力

# 页数预算默认值。variant 可覆盖。
pageBudget: 2

# 声明启用后必须由产物门禁校验的项
gates:
  requireFontsEmbedded: true
  requireDeclaredFont: true
  requireAtsRoundTrip: true
  forbidFullIdNumber: true
  requireStatementLast: true
